
networks:
  parent-net:
    external: true

services:

  payment-db:
    image: postgres:16
    container_name: payment-db
    environment:
      POSTGRES_DB: paymentsidb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data


  payment-service:
    build: .
    container_name: payment-service
    depends_on:
      - payment-db
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentsidb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_BASE_URL: https://www.randomnumberapi.com
      API_PATH: /api/v1.0/random
      API_QUERY: ?min=1&max=100&count=1

volumes:
  payment_pgdata: